    <script>
      (() => {
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const minTime = reduceMotion ? 0 : 1500;
        const fadeTime = reduceMotion ? 0 : 800;
        const startTime = performance.now();
        const appShell = document.getElementById("app-shell");
        const root = document.getElementById("root");
        let pageLoaded = document.readyState === "complete";
        let revealQueued = false;
        root.inert = true;

        function revealContent() {
          if (!pageLoaded || !root.hasChildNodes() || revealQueued) return;
          revealQueued = true;
          observer.disconnect();
          setTimeout(() => {
            document.body.classList.add("loaded");
            document.body.style.overflow = "auto";
            root.inert = false;
            setTimeout(() => appShell.remove(), fadeTime);
          }, Math.max(0, minTime - (performance.now() - startTime)));
        }

        const observer = new MutationObserver(revealContent);
        observer.observe(root, { childList: true });
        window.addEventListener("load", () => {
          pageLoaded = true;
          revealContent();
        }, { once: true });
        revealContent();
      })();
    </script>
