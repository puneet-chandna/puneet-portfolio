name: Deploy Terminal Portfolio

on:
  push:
    branches: [main]
    paths:
      - "terminal/**"
      - ".github/workflows/deploy-terminal.yml"
  workflow_dispatch:

env:
  GO_VERSION: "1.24"
  BINARY_NAME: portfolio

jobs:
  build:
    name: Build Go Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build for Linux amd64
        working-directory: terminal
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ${{ env.BINARY_NAME }} ./cmd/portfolio

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-binary
          path: terminal/${{ env.BINARY_NAME }}
          retention-days: 1

  deploy:
    name: Deploy to GCP VM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-binary

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VM
        env:
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_IP: ${{ secrets.GCP_VM_IP }}
        run: |
          # Stop the service
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP "sudo systemctl stop portfolio || true"

          # Upload new binary
          scp -o StrictHostKeyChecking=no ${{ env.BINARY_NAME }} $VM_USER@$VM_IP:/tmp/

          # Move binary and set permissions
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP "sudo mv /tmp/${{ env.BINARY_NAME }} /opt/terminal-portfolio/ && sudo chmod +x /opt/terminal-portfolio/${{ env.BINARY_NAME }}"

          # Start the service
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP "sudo systemctl start portfolio"

          # Wait and check status
          sleep 3
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP "sudo systemctl status portfolio --no-pager"

      - name: Verify Deployment
        env:
          VM_IP: ${{ secrets.GCP_VM_IP }}
        run: |
          echo "Testing SSH connection to portfolio..."
          # Simple connection test (will fail but we just check if port is open)
          timeout 5 bash -c "echo '' | nc -v $VM_IP 22" || echo "Port 22 is responding"
