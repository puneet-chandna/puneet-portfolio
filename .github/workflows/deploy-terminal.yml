name: Deploy Terminal Portfolio

on:
  push:
    branches: [main]
    paths:
      - "terminal/**"
      - ".github/workflows/deploy-terminal.yml"
  workflow_dispatch:

env:
  GO_VERSION: "1.24"
  BINARY_NAME: portfolio

jobs:
  build:
    name: Build Go Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build for Linux amd64
        working-directory: terminal
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ${{ env.BINARY_NAME }} ./cmd/portfolio

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-binary
          path: terminal/${{ env.BINARY_NAME }}
          retention-days: 1

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-binary

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Use port 2222 for admin SSH (system SSH moved to 2222)
          ssh-keyscan -p 2222 -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Stop the service
          ssh -p 2222 -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo systemctl stop portfolio || true"

          # Upload new binary
          scp -P 2222 -o StrictHostKeyChecking=no ${{ env.BINARY_NAME }} $EC2_USER@$EC2_HOST:/tmp/

          # Move binary and set permissions
          ssh -p 2222 -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo mv /tmp/${{ env.BINARY_NAME }} /opt/terminal-portfolio/ && sudo chmod +x /opt/terminal-portfolio/${{ env.BINARY_NAME }}"

          # Start the service
          ssh -p 2222 -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo systemctl start portfolio"

          # Wait and check status
          sleep 3
          ssh -p 2222 -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo systemctl status portfolio --no-pager"

      - name: Verify Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Testing SSH connection to portfolio on port 22..."
          timeout 5 bash -c "echo '' | nc -v $EC2_HOST 22" || echo "Port 22 is responding"
