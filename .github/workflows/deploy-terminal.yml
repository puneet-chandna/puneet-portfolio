name: Terminal Portfolio CI and Droplet Deployment

on:
  pull_request:
    branches: [main]
    paths: ["terminal/**", ".github/workflows/deploy-terminal.yml"]
  push:
    branches: [main]
    paths: ["terminal/**", ".github/workflows/deploy-terminal.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: terminal-portfolio-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.7"
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: terminal/go.sum
      - name: Verify, test, and scan
        working-directory: terminal
        run: |
          bash -n deploy/update.sh
          python3 deploy/update_test.py
          go mod verify
          go mod tidy -diff
          go vet ./...
          go test -race ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Build and smoke-test container
        working-directory: terminal
        run: |
          docker build --platform linux/amd64 -t "hyr-remote-console:$RELEASE_ID" .
          CONSOLE_IMAGE="hyr-remote-console:$RELEASE_ID" CONSOLE_BIND_IP=127.0.0.1 CONSOLE_PORT=0 \
            docker compose --project-name console-ci up -d --no-build --pull never --wait --wait-timeout 60 console
      - name: Package tested image and deployment files
        run: |
          mkdir release
          docker image save "hyr-remote-console:$RELEASE_ID" | gzip > release/console-image.tar.gz
          cp terminal/docker-compose.yml terminal/deploy/update.sh release/
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-release
          path: release/
          retention-days: 3

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.CONSOLE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
      DROPLET_SSH_PORT: ${{ vars.DROPLET_SSH_PORT || '22' }}
      DROPLET_SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
      DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: terminal-release
          path: release
      - name: Deploy only the remote console service
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DROPLET_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo "Set DROPLET_HOST to the droplet IPv4 address or admin hostname" >&2; exit 1; }
          [[ "$DROPLET_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Set DROPLET_USER" >&2; exit 1; }
          [[ "$DROPLET_SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && (( DROPLET_SSH_PORT <= 65535 )) || { echo "Set a valid DROPLET_SSH_PORT" >&2; exit 1; }
          [[ -n "$DROPLET_SSH_PRIVATE_KEY" && -n "$DROPLET_KNOWN_HOSTS" ]] || { echo "Configure the deploy key and verified known-hosts entry" >&2; exit 1; }
          umask 077
          printf '%s\n' "$DROPLET_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/portfolio-key"
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > "$RUNNER_TEMP/portfolio-known-hosts"
          options=(-F /dev/null -i "$RUNNER_TEMP/portfolio-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/portfolio-known-hosts" -o ConnectTimeout=10)
          target="$DROPLET_USER@$DROPLET_HOST"
          remote_dir="/opt/hyr-remote-console/releases/$RELEASE_ID"
          ssh "${options[@]}" -p "$DROPLET_SSH_PORT" "$target" 'test "$(uname -m)" = x86_64 && command -v flock >/dev/null && docker compose version && test -f /opt/hyr-remote-console/.env'
          ssh "${options[@]}" -p "$DROPLET_SSH_PORT" "$target" "mkdir -p '$remote_dir'"
          scp "${options[@]}" -P "$DROPLET_SSH_PORT" release/console-image.tar.gz release/docker-compose.yml release/update.sh "$target:$remote_dir/"
          ssh "${options[@]}" -p "$DROPLET_SSH_PORT" "$target" "bash '$remote_dir/update.sh'"
