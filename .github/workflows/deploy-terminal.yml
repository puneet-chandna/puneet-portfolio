name: Deploy Terminal Portfolio

on:
  push:
    branches: [main]
    paths:
      - "terminal/**"
      - ".github/workflows/deploy-terminal.yml"
  workflow_dispatch:

# Prevent parallel deployments
concurrency:
  group: deploy-terminal-${{ github.ref }}
  cancel-in-progress: false

# Minimal permissions (principle of least privilege)
permissions:
  contents: read
  actions: read

env:
  GO_VERSION: "1.24"
  BINARY_NAME: portfolio

jobs:
  build:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: terminal/go.sum

      - name: Verify dependencies
        working-directory: terminal
        run: |
          go mod verify
          go mod tidy -diff

      - name: Run security scan (govulncheck)
        working-directory: terminal
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run tests
        working-directory: terminal
        run: |
          go test -race -coverprofile=coverage.out ./... || echo "No tests found, skipping"

      - name: Build for Linux amd64
        working-directory: terminal
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ${{ env.BINARY_NAME }} ./cmd/portfolio

      - name: Verify binary
        working-directory: terminal
        run: |
          file ${{ env.BINARY_NAME }}
          ls -lh ${{ env.BINARY_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-binary
          path: terminal/${{ env.BINARY_NAME }}
          retention-days: 1

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-binary

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 2222 -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e

          echo "::group::Stopping service"
          ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=30 $EC2_USER@$EC2_HOST "sudo systemctl stop portfolio || true"
          echo "::endgroup::"

          echo "::group::Uploading binary"
          scp -P 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=30 ${{ env.BINARY_NAME }} $EC2_USER@$EC2_HOST:/tmp/
          echo "::endgroup::"

          echo "::group::Installing binary"
          ssh -p 2222 -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo mv /tmp/${{ env.BINARY_NAME }} /opt/terminal-portfolio/ && sudo chmod +x /opt/terminal-portfolio/${{ env.BINARY_NAME }}"
          echo "::endgroup::"

          echo "::group::Starting service"
          ssh -p 2222 -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo systemctl start portfolio"
          echo "::endgroup::"

      - name: Health Check with Retry
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Waiting for service to stabilize..."
          sleep 5

          # Retry health check up to 3 times
          for i in 1 2 3; do
            echo "Health check attempt $i..."
            if ssh -p 2222 -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo systemctl is-active portfolio"; then
              echo "✅ Service is healthy!"
              ssh -p 2222 -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo systemctl status portfolio --no-pager"
              exit 0
            fi
            echo "Service not ready, waiting 5s..."
            sleep 5
          done

          echo "❌ Health check failed after 3 attempts"
          ssh -p 2222 -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo journalctl -u portfolio -n 50 --no-pager" || true
          exit 1

      - name: Verify SSH Port
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Testing SSH connection to portfolio on port 22..."
          timeout 5 bash -c "echo '' | nc -v $EC2_HOST 22" || echo "Port 22 is responding"
