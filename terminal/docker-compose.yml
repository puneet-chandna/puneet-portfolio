name: puneet-terminal

services:
  portfolio:
    image: ${PORTFOLIO_IMAGE:-puneet-terminal:local}
    build: .
    restart: unless-stopped
    ports:
      - "${PORTFOLIO_BIND_IP:-127.0.0.1}:${PORTFOLIO_PORT:-2222}:2222"
    environment:
      SSH_PORT: "2222"
      SSH_HOST_KEY_PATH: /app/.ssh/id_ed25519
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_TO: ${RESEND_TO:-}
      GOMEMLIMIT: 192MiB
    volumes:
      - hostkeys:/app/.ssh
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  hostkeys:
